server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:excel-importer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

app:
  security:
    import-username: ${IMPORT_USERNAME:import-admin}
    import-password: ${IMPORT_PASSWORD:}
    import-role: IMPORT_ADMIN
  import:
    chunk-size: 1000
    in-memory-row-threshold: 10000
    issue-preview-limit: 500
    async-core-pool-size: 2
    async-max-pool-size: 4
    async-queue-capacity: 20
    async-await-termination-seconds: 30
